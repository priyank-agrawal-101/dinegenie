[build]
builder = "RAILPACK"
buildCommand = "uv sync --frozen --no-dev"

[deploy]
startCommand = "./.venv/bin/python -m uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=${RAILWAY_TRUSTED_PROXY_IPS:-127.0.0.1}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
