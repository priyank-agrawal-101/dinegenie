name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Lint
        run: ruff check apps/api pipelines scripts
      - name: Check formatting
        run: ruff format --check apps/api pipelines scripts
      - name: Type check
        run: mypy apps/api pipelines scripts
      - name: Test
        run: pytest
      - name: Versioned offline evaluation
        env:
          PYTHONPATH: apps/api
        run: |
          python -m pipelines.cli --mode fixture --runtime-root runtime-data/ci-evaluation
          python -m app.evaluation --mode fake --database runtime-data/ci-evaluation/restaurants.db --output runtime-data/ci-evaluation/report.json
      - name: Audit Python production dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --requirement requirements.lock --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install API dependencies for browser journey
        run: python -m pip install --requirement ../../requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
